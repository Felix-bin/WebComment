<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>promo</title>
  <style>
    html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
    body {
      display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 0 36px; box-sizing: border-box;
      background: #25262b; color: #f1f3f5; font-family: system-ui, "Microsoft YaHei", sans-serif;
    }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 700; }
    .brand img { width: 44px; height: 44px; }
    .line { font-size: 21px; line-height: 1.6; font-weight: 600; }
    .hl { background: rgba(255, 212, 59, .9); color: #25262b; padding: 0 4px; border-radius: 3px; }
    .hl2 { background: rgba(105, 219, 124, .85); color: #25262b; padding: 0 4px; border-radius: 3px; }
    .sub { font-size: 14px; color: #adb5bd; }
  </style>
</head>
<body>
  <div class="brand"><img src="../icons/icon128.png" alt="" />WebComment</div>
  <div class="line">在网页上<span class="hl">高亮</span>、<span class="hl2">批注</span><br />下次打开自动恢复</div>
  <div class="sub">本地存储 · 无需注册 · 开源免费</div>
</body>
</html>
