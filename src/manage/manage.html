<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebComment · 全部笔记</title>
    <link rel="icon" href="../../icons/icon32.png" />
    <link rel="stylesheet" href="manage.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="../../icons/icon48.png" alt="" />
        <div>
          <h1>全部笔记</h1>
          <p id="stats">加载中…</p>
        </div>
      </div>
      <div class="tools">
        <button id="exportMd">导出 Markdown</button>
        <button id="exportJson">导出备份</button>
        <button id="importJson">导入备份</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden />
      </div>
    </header>

    <div class="filters">
      <input type="search" id="search" placeholder="搜索标题、原文或批注…" autocomplete="off" />
      <div class="chips" id="colorChips"></div>
      <label class="check"><input type="checkbox" id="notesOnly" /> 仅看有批注的</label>
    </div>

    <main id="pages"></main>

    <div class="empty" id="empty" hidden>
      <strong id="emptyTitle">还没有任何笔记</strong>
      <p id="emptyText">在网页上选中文字即可高亮和批注，它们会汇总到这里。</p>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script src="../shared/core.js"></script>
    <script src="manage.js"></script>
  </body>
</html>
